name: quality

on:
  pull_request:
  push:
    branches:
      - model/data-pipeline
  workflow_dispatch:

jobs:
  unit-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Unit tests
        run: pytest -q tests/unit

      - name: Ruff lint
        run: ruff check src tests/unit

      - name: Ruff format check
        run: ruff format --check src tests/unit
