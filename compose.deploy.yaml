services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: disclosure-deploy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: disclosure_perf
      POSTGRES_USER: disclosure_perf
      POSTGRES_PASSWORD: ${DEPLOY_POSTGRES_PASSWORD:?set DEPLOY_POSTGRES_PASSWORD}
    volumes:
      - disclosure_deploy_pgdata:/var/lib/postgresql/data
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disclosure_perf -d disclosure_perf"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - database
    logging:
      options:
        max-size: 10m
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    container_name: disclosure-deploy-api
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DISCLOSURE_DATABASE_URL: postgresql+psycopg://disclosure_perf:${DEPLOY_POSTGRES_PASSWORD:?set DEPLOY_POSTGRES_PASSWORD}@postgres:5432/disclosure_perf
      DISCLOSURE_DATABASE_HOST: postgres
      DISCLOSURE_DATABASE_PORT: "5432"
      CLOVASTUDIO_API_KEY: ${CLOVASTUDIO_API_KEY:?set CLOVASTUDIO_API_KEY}
      DISCLOSURE_API_TOKEN: ${DISCLOSURE_API_TOKEN:?set DISCLOSURE_API_TOKEN}
    ports:
      - "127.0.0.1:${DISCLOSURE_API_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - database
      - egress
    logging:
      options:
        max-size: 10m
        max-file: "3"

volumes:
  disclosure_deploy_pgdata:
    name: disclosure_deploy_pgdata

networks:
  database:
    internal: true
  egress:
