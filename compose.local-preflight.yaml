services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    container_name: disclosure-local-preflight-api
    init: true
    environment:
      DISCLOSURE_DATABASE_URL: postgresql+psycopg://${PERF_POSTGRES_USER:?set PERF_POSTGRES_USER}:${PERF_POSTGRES_PASSWORD:?set PERF_POSTGRES_PASSWORD}@host.docker.internal:${PERF_POSTGRES_PORT:-55432}/${PERF_POSTGRES_DB:-disclosure_perf}
      DISCLOSURE_DATABASE_HOST: host.docker.internal
      DISCLOSURE_DATABASE_PORT: ${PERF_POSTGRES_PORT:-55432}
      CLOVASTUDIO_API_KEY: ${CLOVASTUDIO_API_KEY:?set CLOVASTUDIO_API_KEY}
      DISCLOSURE_API_TOKEN: ${DISCLOSURE_API_TOKEN:?set DISCLOSURE_API_TOKEN}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:${LOCAL_PREFLIGHT_PORT:-18000}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).read()
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s
    logging:
      options:
        max-size: 10m
        max-file: "2"
