services:
  perf-db:
    image: pgvector/pgvector:pg16
    container_name: disclosure-perf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PERF_POSTGRES_DB}
      POSTGRES_USER: ${PERF_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PERF_POSTGRES_PASSWORD}
    ports:
      - "${PERF_POSTGRES_PORT:-55432}:5432"
    volumes:
      - disclosure_perf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  disclosure_perf_pgdata:
    name: disclosure_perf_pgdata
