[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disclosure-analyst-agent"
version = "0.1.0"
description = "Disclosure data parsing and analysis agent"
requires-python = ">=3.12"

[project.scripts]
disclosure-agent = "disclosure_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
